---
apiVersion: platform.confluent.io/v1beta1
kind: Zookeeper
metadata:
  name: zookeeper
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-zookeeper:7.7.0
    init: confluentinc/confluent-init-container:2.9.0
  dataVolumeCapacity: 50Gi
  logVolumeCapacity: 50Gi
  # podTemplate:
  #   resources:
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi
  #     requests:
  #       cpu: 400m
  #       memory: 512Mi
  configOverrides:
    jvm:
      - "-Xmx512m"
      - "-Xms512m"
---
apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: kafka
  namespace: confluent
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:7.7.0
    init: confluentinc/confluent-init-container:2.9.0
  dataVolumeCapacity: 50Gi
  tls:
    secretRef: tls-group1
  listeners:
    external:
      authentication:
        type: mtls
        principalMappingRules:
          - RULE:.*CN[\\s]?=[\\s]?([a-zA-Z0-9.]*)?.*/$1/
      externalAccess:
        type: staticForHostBasedRouting
        staticForHostBasedRouting:
          domain: hca.selabs.net
          # brokerPrefix:  ## Bootstrap prefix
          port: 443
      tls:
        enabled: true
  services:
    kafkaRest:
      authentication:
        type: mtls
        # principalMappingRules:
        #   - RULE:.*CN[\\s]?=[\\s]?([a-zA-Z0-9.]*)?.*/$1/
        #   # sslClientAuthentication: requested
  configOverrides:
    jvm: 
      - "-Xmx512m"
      - "-Xms512m"
  # podTemplate:
  #   resources:
  #     limits:
  #       cpu: 1
  #       memory: 1Gi
  #     requests:
  #       cpu: 1
  #       memory: 1Gi
---
apiVersion: platform.confluent.io/v1beta1
kind: Connect
metadata:
  name: connect
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-server-connect:7.7.0
    init: confluentinc/confluent-init-container:2.9.0
  tls:
    secretRef: tls-group1
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
  # podTemplate:
  #   resources:
  #     limits:
  #       cpu: 500m
  #       memory: 512Mi
  #     requests:
  #       cpu: 100m
  #       memory: 256Mi
  configOverrides:
    jvm: 
      - "-Xmx512m"
      - "-Xms512m"
---
apiVersion: platform.confluent.io/v1beta1
kind: ControlCenter
metadata:
  name: controlcenter
  namespace: confluent
spec:
  replicas: 1
  image:
    application: confluentinc/cp-enterprise-control-center:7.7.0
    init: confluentinc/confluent-init-container:2.9.0
  dataVolumeCapacity: 50Gi
  tls:
    secretRef: tls-group1
  dependencies:
    kafka:
      bootstrapEndpoint: kafka:9071
  # podTemplate:
  #   resources:
  #     limits:
  #       cpu: 1
  #       memory: 1Gi
  #     requests:
  #       cpu: 1
  #       memory: 1Gi
  configOverrides:
    jvm: 
      - "-Xmx512m"
      - "-Xms512m"
---
